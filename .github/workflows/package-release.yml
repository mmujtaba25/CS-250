name: Package ZIP releases

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  discover:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.commits.outputs.matrix }}
    steps:
      - name: Check out complete commit history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find every ZIP commit in the push
        id: commits
        run: python3 .github/scripts/package_release.py discover

  package-and-release:
    needs: discover
    if: ${{ needs.discover.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        commit: ${{ fromJSON(needs.discover.outputs.matrix) }}
    concurrency:
      group: zip-release-${{ matrix.commit }}
      cancel-in-progress: false
    steps:
      - name: Check out complete commit history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package the requested commit, push its tag, and publish its release
        env:
          RELEASE_COMMIT: ${{ matrix.commit }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/package_release.py publish
